<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin | Velvet Brew</title>
  <style>
    :root {
      --bg: #f7f0ea;
      --panel: #fffdfb;
      --primary: #7d3f2a;
      --primary-dark: #512d1f;
      --brown: #3a2d2a;
      --text: #2a201d;
      --muted: #6a524c;
      --line: #eadbcc;
      --shadow: 0 18px 32px rgba(62, 38, 30, 0.08);
      --danger: #a43a2b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fffaf5 0%, #f7efe9 100%);
      color: var(--text);
    }

    .login-box {
      width: min(420px, calc(100% - 24px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 800;
      color: var(--brown);
      margin-bottom: 8px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), #a55d34);
      color: white;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(2rem, 4vw, 2.5rem);
      letter-spacing: -0.05em;
      color: var(--brown);
    }

    p {
      margin: 0 0 20px;
      text-align: center;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), #9f522f);
      color: white;
      box-shadow: 0 16px 26px rgba(125, 63, 42, 0.2);
    }

    .message {
      min-height: 20px;
      text-align: center;
      font-size: 0.86rem;
      color: var(--danger);
      font-weight: 700;
    }

    .back-link {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark">V</div>
      <span>Velvet Brew</span>
    </div>

    <h1>Admin</h1>
    <p>Masuk untuk membuka dashboard reservasi.</p>

    <form id="loginForm">
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Masukkan kata sandi" required />
      </div>

      <button class="btn" type="submit">Masuk</button>
      <div class="message" id="message"></div>
    </form>

    <div class="back-link">
      <a href="index.html">← Kembali ke halaman utama</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');
    const correctPassword = 'admin123';
    const sessionKey = 'velvetAdminAuth';

    if (localStorage.getItem(sessionKey) === 'true') {
      window.location.href = 'admin.html';
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const value = passwordInput.value.trim();

      if (value === correctPassword) {
        localStorage.setItem(sessionKey, 'true');
        window.location.href = 'admin.html';
      } else {
        message.textContent = 'Kata sandi salah. Silakan coba lagi.';
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
